<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Render Hamic Trailer (59s)</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070912;
    }
    #gl-canvas {
      position: fixed;
      inset: 0;
      width: 1920px;
      height: 1080px;
      visibility: hidden;
      pointer-events: none;
    }
    #master-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <canvas id="gl-canvas" width="1920" height="1080"></canvas>
  <canvas id="master-canvas" width="1920" height="1080"></canvas>
  <script type="module" src="/src/trailer/main.ts"></script>
</body>
</html>
