<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hamic — Đêm Toán Tin (Trailer V3 Render Harness)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #070912;
        overflow: hidden;
      }
      #trailer-v3-app {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #070912;
      }
      #trailer-v3-canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
      #trailer-v3-hud {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="trailer-v3-app">
      <canvas id="trailer-v3-canvas"></canvas>
      <div id="trailer-v3-hud"></div>
    </div>
    <script type="module" src="/src/trailer-v3/main.ts"></script>
  </body>
</html>
